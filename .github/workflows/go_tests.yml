name: Go Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go_tests:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
